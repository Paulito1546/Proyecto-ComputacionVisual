<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Multimodal: Voz + Gestos + EEG</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"
            }
        }
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <h2>🧠 Control EEG</h2>
            <div class="slider-group">
                <label>Alpha (Relax) <span id="val-alpha">0</span></label>
                <input type="range" id="slider-alpha" min="0" max="100" value="10">
            </div>
            <div class="slider-group">
                <label>Beta (Focus) <span id="val-beta">0</span></label>
                <input type="range" id="slider-beta" min="0" max="100" value="50">
            </div>
            <div class="slider-group">
                <label>Gamma (Cognitive) <span id="val-gamma">0</span></label>
                <input type="range" id="slider-gamma" min="0" max="100" value="10">
            </div>
            
            <div class="instructions">
                <h3>Instrucciones</h3>
                <ul>
                    <li>👍 <b>Pulgar Arriba:</b> Acelerar</li>
                    <li>✊ <b>Puño:</b> Pausa (Freeze)</li>
                    <li>✋ <b>Mano Abierta:</b> Invertir giro</li>
                    <li>🗣️ <b>"Día":</b> Fondo Blanco</li>
                    <li>🗣️ <b>"Noche":</b> Fondo Negro</li>
                </ul>
            </div>
        </aside>

        <main class="main-content">
            <div class="viewport-container">
                <div class="view-box camera-view">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="output_canvas"></canvas>
                    <div class="overlay-label">📷 Visión Computarizada</div>
                </div>
                <div class="view-box scene-view" id="scene-container">
                    <div class="overlay-label">🧊 Escena WebGL</div>
                </div>
            </div>

            <div class="logs-panel">
                <h3>📟 Historial de Eventos (Tiempo Real)</h3>
                <div id="log-container">
                    <p class="log-entry system">Sistema inicializando...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
